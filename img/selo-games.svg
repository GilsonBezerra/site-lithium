<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-labelledby="title">
  <title id="title">Selo Lithium Games</title>
  <defs>
    <linearGradient id="ringGames" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
  </defs>

  <circle cx="120" cy="120" r="112" fill="none" stroke="url(#ringGames)" stroke-width="2.5"/>
  <circle cx="120" cy="120" r="101" fill="none" stroke="#facc15" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="2 5"/>
  <circle cx="120" cy="120" r="66" fill="#14121c" stroke="#facc15" stroke-width="3"/>

  <path id="gamesTopArc" d="M 34,120 A 86,86 0 0 1 206,120" fill="none"/>
  <path id="gamesBottomArc" d="M 34,120 A 86,86 0 0 0 206,120" fill="none"/>

  <text font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="20" letter-spacing="4" fill="#f4f2f7">
    <textPath href="#gamesTopArc" startOffset="50%" text-anchor="middle">LITHIUM</textPath>
  </text>
  <text font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="18" letter-spacing="4" fill="#facc15">
    <textPath href="#gamesBottomArc" startOffset="50%" text-anchor="middle" dy="-6">GAMES</textPath>
  </text>

  <path d="M 34,120 l -8,-8 l 0,16 z" fill="#facc15"/>
  <path d="M 206,120 l 8,-8 l 0,16 z" fill="#facc15"/>

  <!-- d20 die mark -->
  <g transform="translate(120,122)">
    <path d="M 0,-28 L 25,-14 L 25,14 L 0,28 L -25,14 L -25,-14 Z" fill="none" stroke="#f4f2f7" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M 0,-28 L 0,0 L 25,-14 Z M 0,0 L 25,14 L 0,28 Z M 0,0 L -25,14 L 0,28 Z M 0,0 L -25,-14 L 0,-28 Z" fill="none" stroke="#facc15" stroke-width="1.6" stroke-linejoin="round"/>
    <text x="0" y="5" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="16" fill="#f4f2f7" text-anchor="middle">20</text>
  </g>
</svg>
