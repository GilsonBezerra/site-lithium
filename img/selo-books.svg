<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-labelledby="title">
  <title id="title">Selo Lithium Books</title>
  <defs>
    <linearGradient id="ringBooks" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <circle cx="120" cy="120" r="112" fill="none" stroke="url(#ringBooks)" stroke-width="2.5"/>
  <circle cx="120" cy="120" r="101" fill="none" stroke="#f43f5e" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="2 5"/>
  <circle cx="120" cy="120" r="66" fill="#14121c" stroke="#f43f5e" stroke-width="3"/>

  <path id="booksTopArc" d="M 34,120 A 86,86 0 0 1 206,120" fill="none"/>
  <path id="booksBottomArc" d="M 34,120 A 86,86 0 0 0 206,120" fill="none"/>

  <text font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="20" letter-spacing="4" fill="#f4f2f7">
    <textPath href="#booksTopArc" startOffset="50%" text-anchor="middle">LITHIUM</textPath>
  </text>
  <text font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="18" letter-spacing="4" fill="#f43f5e">
    <textPath href="#booksBottomArc" startOffset="50%" text-anchor="middle" dy="-6">BOOKS</textPath>
  </text>

  <path d="M 34,120 l -8,-8 l 0,16 z" fill="#f43f5e"/>
  <path d="M 206,120 l 8,-8 l 0,16 z" fill="#f43f5e"/>

  <!-- open book mark -->
  <g transform="translate(120,124)">
    <path d="M 0,-16 C -10,-21 -22,-21 -30,-17 L -30,14 C -22,10 -10,10 0,15 Z" fill="none" stroke="#f4f2f7" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M 0,-16 C 10,-21 22,-21 30,-17 L 30,14 C 22,10 10,10 0,15 Z" fill="none" stroke="#f4f2f7" stroke-width="3.5" stroke-linejoin="round"/>
    <line x1="0" y1="-16" x2="0" y2="15" stroke="#f43f5e" stroke-width="3"/>
  </g>
</svg>
